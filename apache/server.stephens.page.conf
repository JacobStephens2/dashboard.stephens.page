<VirtualHost *:80>
    ServerName server.stephens.page

    ProxyPreserveHost On

    # muxboard console (same-host path; gated by dash_session cookie)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/muxboard/?(.*)$ "ws://127.0.0.1:3492/muxboard/$1" [P,L]

    # Legacy path: /console → /muxboard
    RewriteRule ^/console$ /muxboard/ [R=301,L]
    RewriteRule ^/console/(.*)$ /muxboard/$1 [R=301,L]

    ProxyPass /muxboard/ http://127.0.0.1:3492/muxboard/
    ProxyPass /muxboard  http://127.0.0.1:3492/muxboard
    ProxyPassReverse /muxboard/ http://127.0.0.1:3492/muxboard/

    ProxyPass /        http://127.0.0.1:3460/
    ProxyPassReverse / http://127.0.0.1:3460/

    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port  "80"

    ErrorLog ${APACHE_LOG_DIR}/server.stephens.page-error.log
    CustomLog ${APACHE_LOG_DIR}/server.stephens.page-access.log combined
RewriteEngine on
RewriteCond %{SERVER_NAME} =server.stephens.page
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
