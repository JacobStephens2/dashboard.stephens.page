<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName code.stephens.page
    ServerAdmin jacob.stephens.701@gmail.com

    ProxyPreserveHost On
    ProxyRequests Off

    # WebSocket upgrade (VS Code workbench / terminal / extensions)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/?(.*) "ws://127.0.0.1:3493/$1" [P,L]

    ProxyPass        / http://127.0.0.1:3493/
    ProxyPassReverse / http://127.0.0.1:3493/

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"

    # Private IDE: keep out of search indexes
    Header always set X-Robots-Tag "noindex, nofollow, noarchive"

    ErrorLog  ${APACHE_LOG_DIR}/code.stephens.page-error.log
    CustomLog ${APACHE_LOG_DIR}/code.stephens.page-access.log combined

SSLCertificateFile /etc/letsencrypt/live/code.stephens.page/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/code.stephens.page/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
