<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName dashboard.stephens.page

    ProxyPreserveHost On

    # muxboard console (same-host path; gated by dash_session cookie)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/muxboard/?(.*)$ "ws://127.0.0.1:3492/muxboard/$1" [P,L]

    # Legacy path: /console → /muxboard
    RewriteRule ^/console$ /muxboard/ [R=301,L]
    RewriteRule ^/console/(.*)$ /muxboard/$1 [R=301,L]

    ProxyPass /muxboard/ http://127.0.0.1:3492/muxboard/
    ProxyPass /muxboard  http://127.0.0.1:3492/muxboard
    ProxyPassReverse /muxboard/ http://127.0.0.1:3492/muxboard/

    ProxyPass /        http://127.0.0.1:3460/
    ProxyPassReverse / http://127.0.0.1:3460/

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"

    ErrorLog ${APACHE_LOG_DIR}/dashboard.stephens.page-error.log
    CustomLog ${APACHE_LOG_DIR}/dashboard.stephens.page-access.log combined

SSLCertificateFile /etc/letsencrypt/live/dashboard.stephens.page/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/dashboard.stephens.page/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
